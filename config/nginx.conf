server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html;

    server_name _;

    location / {
        try_files $uri $uri/ =404;
    }

    # Block external access to potential database, config or sensitive files
    location ~* \.(sqlite|db|env|cfg|ini|yaml|yml)$ {
        deny all;
    }
}
